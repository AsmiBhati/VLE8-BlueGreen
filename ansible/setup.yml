
---
- name: Configure VLE 8 Blue Green Deployment Server
  hosts: vle8
  become: yes

  tasks:
    - name: Update package cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - curl
          - git
          - docker.io
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Enable K3s
      service:
        name: k3s
        state: started
        enabled: yes

    - name: Wait for Kubernetes API
      command: /usr/local/bin/k3s kubectl get nodes
      register: k3s_status
      retries: 15
      delay: 10
      until: k3s_status.rc == 0

    - name: Display Kubernetes nodes
      debug:
        var: k3s_status.stdout
